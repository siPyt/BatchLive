<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background-color: #EAEAEA; font-family: 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <style>
      .pipe-sanitary  { stroke: #7A8B99; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pipe-utility   { stroke: #A0A0A0; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .pipe-signal    { stroke: #555555; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .vessel-shell   { fill: #D9D9D9; stroke: #666666; stroke-width: 2; }
      .vessel-fluid   { fill: #8DA1B0; }
      .metal-detail   { fill: #B8B8B8; stroke: #404040; stroke-width: 1.5; }
      .valve-body     { fill: #A6A6A6; stroke: #404040; stroke-width: 1.5; }
      .tag-text       { font-size: 10px; font-weight: 700; fill: #222222; text-anchor: middle; }
      .readout-val    { font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; fill: #111111; text-anchor: end; }
      .unit-text      { font-size: 9px; fill: #555555; }
    </style>
    <clipPath id="wfi-tank-clip">
      <rect x="102" y="110" width="136" height="150" />
    </clipPath>
  </defs>

  <!-- ================= 1. WFI STORAGE TANK (TK-401) ================= -->
  <g id="vessel-TK401">
    <!-- Vessel Legs -->
    <rect x="120" y="270" width="10" height="40" class="metal-detail" />
    <rect x="210" y="270" width="10" height="40" class="metal-detail" />
    
    <!-- Pressure Shell with Dished Heads -->
    <path d="M 100,100 Q 170,70 240,100 L 240,260 Q 170,290 100,260 Z" class="vessel-shell" />
    <!-- Fluid Fill (70%) -->
    <path d="M 102,150 L 238,150 L 238,260 Q 170,288 102,260 Z" class="vessel-fluid" />

    <!-- Top Spray Ball Recirculation Assembly -->
    <line x1="170" y1="50" x2="170" y2="90" class="pipe-sanitary" />
    <circle cx="170" cy="94" r="5" fill="#555" />
    <line x1="164" y1="98" x2="158" y2="104" stroke="#7A8B99" stroke-width="1.5" />
    <line x1="176" y1="98" x2="182" y2="104" stroke="#7A8B99" stroke-width="1.5" />
    <line x1="170" y1="100" x2="170" y2="108" stroke="#7A8B99" stroke-width="1.5" />

    <!-- Tank Title -->
    <rect x="120" y="110" width="100" height="16" rx="2" fill="#EEEEEE" stroke="#A0A0A0" stroke-width="1" />
    <text x="170" y="122" class="tag-text">TK-401 WFI</text>
  </g>

  <!-- ================= 2. DUAL DISTRIBUTION PUMPS (P-401 & P-402) ================= -->
  <!-- Bottom Suction Header from TK-401 -->
  <path d="M 170,280 L 170,360 L 280,360" class="pipe-sanitary" />
  
  <!-- Suction Split to P-401 (Primary) and P-402 (Standby) -->
  <path d="M 280,330 L 320,330" class="pipe-sanitary" />
  <path d="M 280,360 L 280,410 L 320,410" class="pipe-sanitary" />
  <line x1="280" y1="330" x2="280" y2="360" class="pipe-sanitary" />

  <!-- P-401 (Running Primary) -->
  <g transform="translate(340, 330)">
    <rect x="-28" y="-10" width="16" height="20" class="metal-detail" />
    <circle cx="0" cy="0" r="14" fill="#6E7B8B" stroke="#404040" stroke-width="2" />
    <path d="M 6,0 L 14,0 L 14,-18 L 6,-18 Z" fill="#6E7B8B" stroke="#404040" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#FFF" stroke="#333" stroke-width="1" />
    <text x="0" y="24" class="tag-text">P-401</text>
  </g>

  <!-- P-402 (Standby) -->
  <g transform="translate(340, 410)">
    <rect x="-28" y="-10" width="16" height="20" class="metal-detail" />
    <circle cx="0" cy="0" r="14" fill="#A6A6A6" stroke="#404040" stroke-width="2" />
    <path d="M 6,0 L 14,0 L 14,-18 L 6,-18 Z" fill="#A6A6A6" stroke="#404040" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#FFF" stroke="#333" stroke-width="1" />
    <text x="0" y="24" class="tag-text" style="fill: #777;">P-402 (STBY)</text>
  </g>

  <!-- Pump Discharge Headers with Check Valves -->
  <path d="M 350,312 L 350,290 L 410,290" class="pipe-sanitary" />
  <path d="M 350,392 L 350,370 L 380,370 L 380,290 L 410,290" class="pipe-sanitary" />
  
  <!-- Check Valve on P-401 Discharge -->
  <g transform="translate(380, 290)">
    <circle cx="0" cy="0" r="7" class="metal-detail" />
    <line x1="-4" y1="4" x2="4" y2="-4" stroke="#333" stroke-width="1.5" />
  </g>

  <!-- ================= 3. DISTRIBUTION HEAT EXCHANGER (HEX-401) ================= -->
  <!-- Main Process Pipe entering Tube Side -->
  <path d="M 410,290 L 470,290" class="pipe-sanitary" />

  <g id="heat-exchanger-HEX401" transform="translate(470, 260)">
    <!-- Shell Body -->
    <rect x="20" y="0" width="120" height="60" rx="3" class="vessel-shell" />
    <!-- Tube Sheet Flanges -->
    <rect x="15" y="-3" width="5" height="66" class="metal-detail" />
    <rect x="140" y="-3" width="5" height="66" class="metal-detail" />
    <!-- Dished Channel Heads -->
    <path d="M 15,0 Q 0,30 15,60 Z" class="vessel-shell" />
    <path d="M 140,0 Q 155,30 140,60 Z" class="vessel-shell" />
    <!-- Tube Pass Lines -->
    <line x1="20" y1="20" x2="140" y2="20" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="20" y1="30" x2="140" y2="30" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="20" y1="40" x2="140" y2="40" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- Equipment Label -->
    <text x="80" y="34" class="tag-text">HEX-401 DTS</text>

    <!-- Cooling Utility Connections (Shell Side) -->
    <path d="M 50,-20 L 50,0" class="pipe-utility" />
    <path d="M 110,60 L 110,80" class="pipe-utility" />
    <text x="50" y="-25" class="tag-text" style="font-size: 8px; fill: #666;">CW IN</text>
    <text x="110" y="92" class="tag-text" style="font-size: 8px; fill: #666;">CW RET</text>
  </g>

  <!-- ================= 4. SANITARY SUPPLY & RETURN LOOP ================= -->
  <!-- Supply Header Leaving HEX-401 to Points-of-Use -->
  <path d="M 625,290 L 820,290 L 820,50" class="pipe-sanitary" />
  
  <!-- Flow Direction Arrows on Supply Line -->
  <path d="M 720,286 L 726,290 L 720,294" fill="none" stroke="#FFF" stroke-width="1.5" />
  <path d="M 816,180 L 820,174 L 824,180" fill="none" stroke="#FFF" stroke-width="1.5" />

  <!-- Point-of-Use (POU) Drops -->
  <g transform="translate(820, 220)">
    <path d="M 0,0 L 50,0" class="pipe-sanitary" />
    <polygon points="50,-6 50,6 60,0" class="valve-body" />
    <polygon points="70,-6 70,6 60,0" class="valve-body" />
    <text x="80" y="4" class="tag-text" style="text-anchor: start;">POU-01 USE DROP</text>
  </g>

  <!-- Return Loop Header Running Back to Tank Spray Ball -->
  <path d="M 820,50 L 170,50" class="pipe-sanitary" />
  <!-- Return Flow Chevron -->
  <path d="M 480,46 L 474,50 L 480,54" fill="none" stroke="#FFF" stroke-width="1.5" />

  <!-- Backpressure Regulating Valve (PCV-401) on Loop Return -->
  <g transform="translate(290, 50)">
    <polygon points="-8,-6 8,-6 0,0" class="valve-body" />
    <polygon points="-8,6 8,6 0,0" class="valve-body" />
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#404040" stroke-width="1.5" />
    <path d="M -8,-10 Q 0,-16 8,-10 Z" class="metal-detail" />
    <text x="0" y="20" class="tag-text">PCV-401</text>
  </g>

  <!-- ================= 5. ANALYTICAL RELEASE INSTRUMENTATION ================= -->
  <!-- Online Conductivity Transmitter (AIT-401 USP <645>) -->
  <circle cx="700" cy="50" r="3" fill="#333" />
  <line x1="700" y1="50" x2="700" y2="90" class="pipe-signal" />
  <g transform="translate(645, 90)">
    <rect x="0" y="0" width="110" height="42" rx="2" fill="#FFFFFF" stroke="#999" stroke-width="1" />
    <rect x="0" y="0" width="110" height="14" fill="#D6D6D6" />
    <text x="5" y="10" class="tag-text" style="font-size: 8px; text-anchor: start;">AIT-401 (USP COND)</text>
    <text x="75" y="29" class="readout-val">0.74</text>
    <text x="78" y="28" class="unit-text">µS/cm</text>
  </g>

  <!-- Loop Return Temperature Transmitter (TIC-401) -->
  <circle cx="560" cy="50" r="3" fill="#333" />
  <line x1="560" y1="50" x2="560" y2="90" class="pipe-signal" />
  <g transform="translate(505, 90)">
    <rect x="0" y="0" width="110" height="42" rx="2" fill="#FFFFFF" stroke="#999" stroke-width="1" />
    <rect x="0" y="0" width="110" height="14" fill="#D6D6D6" />
    <text x="5" y="10" class="tag-text" style="font-size: 8px; text-anchor: start;">TIC-401/PV</text>
    <text x="75" y="29" class="readout-val">81.8</text>
    <text x="78" y="28" class="unit-text">°C</text>
  </g>
</svg>
